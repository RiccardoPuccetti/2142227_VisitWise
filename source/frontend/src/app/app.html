<!-- App shell (owner: Rivera, task RIV-1). Keep it minimal: header + routed page.
     Tenant menu (profile link, logout): Puccetti, PUC-9. -->
<header class="border-b">
  <nav class="mx-auto flex max-w-7xl items-center gap-6 px-4 py-3" aria-label="Main">
    <a routerLink="/imports" class="text-lg font-bold tracking-tight">VisitWise</a>
    @if (auth.currentTenant(); as tenant) {
      <a routerLink="/imports" routerLinkActive="font-semibold" class="text-sm">Imports</a>
      <div class="ml-auto flex items-center gap-4 text-sm">
        <a routerLink="/profile" routerLinkActive="font-semibold" aria-label="Profile of {{ tenant.name }}">
          {{ tenant.name }}
        </a>
        <button type="button" class="underline-offset-4 hover:underline" (click)="logout()">Log out</button>
      </div>
    }
  </nav>
</header>
<main class="mx-auto max-w-7xl px-4 py-6">
  <router-outlet />
</main>
