<!-- App shell (owner: Rivera, task RIV-1): header with navigation + routed page + toaster. -->
<a
  href="#main"
  (click)="skipToMain($event)"
  class="bg-background text-foreground sr-only z-50 rounded-md border px-3 py-2 focus:not-sr-only focus:fixed focus:top-2 focus:left-2"
  >Skip to main content</a
>

<header class="bg-background border-b">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
    <a routerLink="/imports" class="text-lg font-bold tracking-tight">VisitWise</a>

    <nav aria-label="Main" class="flex items-center gap-4 text-sm">
      <a
        routerLink="/imports"
        routerLinkActive="text-foreground font-semibold"
        #importsLink="routerLinkActive"
        [class.text-muted-foreground]="!importsLink.isActive"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="hover:text-foreground"
        >Imports</a
      >
      <a
        routerLink="/imports/new"
        routerLinkActive="text-foreground font-semibold"
        #newImportLink="routerLinkActive"
        [class.text-muted-foreground]="!newImportLink.isActive"
        ariaCurrentWhenActive="page"
        class="hover:text-foreground"
        >New import</a
      >
    </nav>

    @if (importId() !== null) {
      <nav
        [attr.aria-label]="'Import ' + importId()"
        class="flex items-center gap-4 text-sm sm:border-l sm:pl-6"
      >
        @for (section of importSections(); track section.label) {
          <a
            [routerLink]="section.link"
            routerLinkActive="text-foreground font-semibold"
            #sectionLink="routerLinkActive"
            [class.text-muted-foreground]="!sectionLink.isActive"
            [routerLinkActiveOptions]="{ exact: section.exact }"
            ariaCurrentWhenActive="page"
            class="hover:text-foreground"
            >{{ section.label }}</a
          >
        }
      </nav>
    }
  </div>
</header>

<main id="main" tabindex="-1" class="mx-auto max-w-7xl px-4 py-6 outline-none">
  <router-outlet />
</main>

<hlm-toaster />
