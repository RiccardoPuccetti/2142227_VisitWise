server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Excel uploads
    client_max_body_size 20m;

    # Same-origin API: no CORS needed. "backend" is the docker compose service name.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Angular client-side routing. Security headers for the app itself (AUTHENTICATION.md step 9);
    # /api responses keep the headers set by Spring Security.
    location / {
        # script-src 'self': no inline scripts (inlineCritical is off in angular.json).
        # style-src 'unsafe-inline': Angular injects component styles at runtime.
        # img-src: OpenStreetMap tiles for the map (OpenLayers OSM source).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # OSM tile usage policy needs a Referer: send only the origin to other sites.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
