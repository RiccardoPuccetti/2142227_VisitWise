# Liquibase master changelog.
# RULES (see AGENTS.md):
#  - NEVER edit a changeset that has already been merged into develop. Add a new file instead.
#  - New file name: NNN-short-description.sql (next free number), then include it below.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-initial-schema.sql
  - include:
      file: db/changelog/changes/002-tenant.sql
  - include:
      file: db/changelog/changes/003-import-tenant.sql
  - include:
      file: db/changelog/changes/004-import-batch-inserts.sql
  # Development data: only with the Liquibase context "dev" (LIQUIBASE_CONTEXTS). Keep it last.
  - include:
      file: db/changelog/dev/100-demo-tenant.sql
